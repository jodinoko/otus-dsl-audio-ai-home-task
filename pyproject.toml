[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "otus-dsl-audio-ai-home-task"
version = "0.1.0"
description = "Audio AI homework: multimodal voice assistant"
requires-python = ">=3.12,<3.14"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "edge-tts>=7.3.1",
    "gradio>=6.31.0",
    "gtts>=2.5.4",
    "noisereduce>=3.0.3",
    "omegaconf>=2.4.0",
    "openai-whisper>=20250625",
    "pillow>=12.3.0",
    "qwen-vl-utils>=0.0.14",
    "soundfile>=0.14.0",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
    "transformers>=4.57",
]

[project.optional-dependencies]
dev = ["ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/audio_ai"]

[tool.ruff]
line-length = 100
